name: Scan Secret History

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Scan all reachable commits for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history including PR ancestors
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pre-commit"
          version=$(python3 -c 'import json; print(json.load(open("packages/bootstrap.json"))["pre_commit_version"])')
          "$RUNNER_TEMP/pre-commit/bin/pip" install "pre-commit==$version"
          echo "$RUNNER_TEMP/pre-commit/bin" >> "$GITHUB_PATH"
      - name: Scan history and verify deleted-secret detection
        run: |
          pre-commit run betterleaks-history --hook-stage manual --all-files
          ./tests/test-secret-history.sh
