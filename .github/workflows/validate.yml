name: Validate Setup Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Validate declarations and shell syntax
        shell: bash
        run: |
          bash -n setup.sh uninstall.sh .local/bin/pkgupd \
            scripts/install-mise.sh scripts/test-pkgupd.sh \
            scripts/test-wezterm-herdr-fallback.sh
          ./setup.sh --help
          ./uninstall.sh --help
          test ! -e Brewfile
          test -f .config/mise/config.toml
          test -f .config/mise/mise.lock
          if grep -Eq '^(rust|node|fd)[[:space:]]*=' .config/mise/config.toml; then
            echo "mise config contains a removed dependency." >&2
            exit 1
          fi
          grep -Eq '^bun[[:space:]]*=[[:space:]]*"latest"$' .config/mise/config.toml
          grep -Eq '^neovim[[:space:]]*=[[:space:]]*"latest"$' .config/mise/config.toml
          grep -Eq '^herdr[[:space:]]*=[[:space:]]*"latest"$' .config/mise/config.toml
          grep -Eq '^minimum_release_age[[:space:]]*=[[:space:]]*"7d"$' .config/mise/config.toml
          grep -Eq '^MISE_VERSION=v[0-9]{4}\.[0-9]+\.[0-9]+$' scripts/install-mise.sh
          for path in \
            .config/herdr/herdr-client.log \
            .config/herdr/herdr-server.log \
            .config/herdr/session.json; do
            git check-ignore --no-index --quiet "$path"
          done
          if git check-ignore --no-index --quiet .config/herdr/config.toml; then
            echo "Managed Herdr config must not be ignored." >&2
            exit 1
          fi
          grep -Eq '^config\.enable_tab_bar[[:space:]]*=[[:space:]]*false$' .config/wezterm/wezterm.lua
          grep -Eq '^    config\.window_decorations = "TITLE \| RESIZE"$' .config/wezterm/wezterm.lua
          grep -Eq '^    config\.window_decorations = "RESIZE"$' .config/wezterm/wezterm.lua
          grep -Fq "then herdr && exit;" .config/wezterm/wezterm.lua
          grep -Fq "hrrでセッションを再起動できます" .config/wezterm/wezterm.lua
          grep -Fq "fi; exec zsh -l" .config/wezterm/wezterm.lua
          grep -q 'send_herdr_prefix_key' .config/wezterm/wezterm.lua
          grep -Eq 'key = "T".*mods = "CMD\|SHIFT".*send_herdr_prefix_key\("n", "SHIFT"\)' .config/wezterm/wezterm.lua
          grep -Eq 'key = "N".*mods = "CTRL\|SHIFT".*send_herdr_prefix_key\("n", "SHIFT"\)' .config/wezterm/wezterm.lua
          if command -v zsh >/dev/null 2>&1; then
            zsh -n .zshrc
          fi
          grep -q '^hrr() {' .zshrc
          grep -Fq "herdr session stop \"\$session_name\"" .zshrc
          grep -q '^hrw() {' .zshrc
          if grep -Eq 'format-tab-title|show_new_tab_button_in_tab_bar' .config/wezterm/wezterm.lua; then
            echo "WezTerm native tab UI must stay disabled in favor of Herdr tabs." >&2
            exit 1
          fi
          grep -Eq '^prompt_new_tab_name[[:space:]]*=[[:space:]]*false$' .config/herdr/config.toml
          grep -Eq '^hide_tab_bar_when_single_tab[[:space:]]*=[[:space:]]*false$' .config/herdr/config.toml
          if grep -Eq '^tmux[[:space:]]*=' .config/mise/config.toml; then
            echo "mise config still contains the replaced tmux dependency." >&2
            exit 1
          fi
          if grep -R -q 'nvim-treesitter/nvim-treesitter' .config/nvim .config/mise packages; then
            echo "Archived nvim-treesitter dependency is not allowed; use Neovim built-in parsers." >&2
            exit 1
          fi

      - name: Run complete setup
        shell: bash
        run: |
          ln -s "$PWD/.tmux.conf" "$HOME/.tmux.conf"
          ./setup.sh --force | tee setup_log.txt
          test ! -L "$HOME/.tmux.conf"

      - name: Verify tools, integrations, and symlinks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims:$PATH"

          for tool in mise zsh nvim starship lazygit sheldon gh herdr zoxide fzf go uv bun pre-commit; do
            command -v "$tool"
          done
          mise ls --current

          data_home=${XDG_DATA_HOME:-$HOME/.local/share}
          test -x "$data_home/dotfiles-lsp/node_modules/.bin/typescript-language-server"
          test -x "$data_home/dotfiles-lsp/node_modules/.bin/pyright-langserver"
          test -x .git/hooks/pre-commit
          test -x .git/hooks/commit-msg

          for path in \
            "$HOME/.zshrc" \
            "$HOME/.local/bin/pkgupd" \
            "$HOME/.config/mise" \
            "$HOME/.config/herdr/config.toml" \
            "$HOME/.config/starship.toml" \
            "$HOME/.config/nvim" \
            "$HOME/.config/wezterm" \
            "$HOME/.config/sheldon" \
            "$HOME/.config/lazygit" \
            "$HOME/.config/gh"; do
            test -L "$path"
          done

      - name: Run functional smoke tests
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims:$PATH"
          ./scripts/smoke-test.sh

      - name: Verify locked mise configuration
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims:$PATH"
          mise install --locked
          mise lock --global \
            --platform linux-arm64,linux-x64,macos-arm64,macos-x64 \
            --minimum-release-age 7d
          git diff --exit-code -- .config/mise/config.toml .config/mise/mise.lock

      - name: Run repository checks
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims:$PATH"
          pre-commit run --all-files
          if [ "$RUNNER_OS" = "Linux" ]; then
            pre-commit run betterleaks-working-tree --hook-stage manual --all-files
          fi

      - name: Verify safe conflict behavior
        shell: bash
        run: |
          rm "$HOME/.zshrc"
          echo sentinel > "$HOME/.zshrc"
          ./setup.sh
          grep -q sentinel "$HOME/.zshrc"
          ./setup.sh --force
          test -L "$HOME/.zshrc"

      - name: Verify safe uninstallation
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims:$PATH"
          ./uninstall.sh
          test ! -L "$HOME/.zshrc"
          test ! -L "$HOME/.local/bin/pkgupd"
          test ! -L "$HOME/.config/nvim"
          test ! -L "$HOME/.config/mise"
          mise exec -- nvim --version
          mise exec -- bun --version

          ./setup.sh --force
          printf 'y\n' | ./uninstall.sh --packages
          test ! -L "$HOME/.config/mise"
          test ! -e "${XDG_DATA_HOME:-$HOME/.local/share}/dotfiles-lsp"
          command -v mise
          test -z "$(mise ls --installed --no-header 2>/dev/null)"
