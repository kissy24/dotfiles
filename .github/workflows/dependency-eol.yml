name: Check Dependency Health

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Brewfile
      - .config/nvim/**
      - .config/sheldon/**
      - .github/workflows/**
      - .pre-commit-config.yaml
      - packages/**
      - scripts/check-dependency-eol.sh
      - scripts/check-dependency-cooldown.sh
      - scripts/dependency_observations.py

permissions:
  contents: read

jobs:
  dependency-eol:
    name: Check dependency lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Reject archived, disabled, or deprecated dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-dependency-eol.sh

  dependency-cooldown:
    name: Check dependency cooldown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Require trusted observations for Git dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-dependency-cooldown.sh
