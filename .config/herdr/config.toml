# Keep the managed config immutable during Herdr's first launch.
onboarding = false

[theme]
# Reuse the host terminal palette.
name = "terminal"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
reload_config = "prefix+shift+r"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "Open lazygit"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+e"
type = "popup"
command = """nvim -c 'lua require("oil").open(".")'"""
description = "Browse files in Neovim"
width = "90%"
height = "85%"

[ui]
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
sidebar_collapsed_mode = "hidden"
